<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7eefc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HomeGlass" />
    <title>HomeGlass</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232c6bff'/%3E%3Cpath d='M32 14 12 31h6v19h10V38h8v12h10V31h6z' fill='white'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--
        PHIÊN BẢN APP: tăng số này MỖI LẦN cập nhật code.
        Mọi file CSS/JS được tải kèm "?v=<phiên bản>" nên điện thoại luôn lấy đủ bộ file mới,
        không trộn file cũ trong bộ nhớ đệm với file mới (trộn lẫn là app không mở được).
        Thêm file JS mới thì nhớ thêm tên vào danh sách JS_FILES bên dưới.
    -->
    <script>
        var HG_VERSION = '0.13.0';
        var JS_FILES = [
            'main.js',
            'core/config.js', 'core/homeData.js', 'core/store.js', 'core/settings.js',
            'core/scenes.js', 'core/commands.js', 'core/stairs.js', 'core/sun.js', 'core/schedules.js',
            'core/errlog.js', 'core/protocol.js', 'core/auth.js', 'core/sync.js', 'core/firmware.js',
            'transport/demo.js', 'transport/mqtt.js',
            'ui/dom.js', 'ui/toast.js', 'ui/feedback.js', 'ui/icons.js', 'ui/router.js', 'ui/sheet.js',
            'ui/motion.js', 'ui/swipe.js', 'ui/chart.js', 'ui/press.js', 'ui/transition.js', 'ui/wheel.js',
            'ui/views/home.js', 'ui/views/temperature.js', 'ui/views/scenes.js', 'ui/views/assistant.js',
            'ui/views/settings.js', 'ui/views/manage.js', 'ui/views/telegram.js', 'ui/views/stairs.js', 'ui/views/login.js'
        ];
        ['tokens', 'base', 'components', 'views'].forEach(function (name) {
            document.write('<link rel="stylesheet" href="css/' + name + '.css?v=' + HG_VERSION + '" />');
        });
        // Bản đồ module: mọi lệnh import './x.js' trong code đều tự trỏ sang './x.js?v=<phiên bản>'
        var importMap = { imports: {} };
        JS_FILES.forEach(function (f) { importMap.imports['./js/' + f] = './js/' + f + '?v=' + HG_VERSION; });
        document.write('<script type="importmap">' + JSON.stringify(importMap) + '<\/script>');
    </script>

    <!-- Áp chủ đề sáng/tối NGAY, trước khi vẽ trang, để không bị nháy màu -->
    <script>
        try {
            var s = JSON.parse(localStorage.getItem('hg.settings') || '{}');
            if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
            if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
        } catch (e) {}
    </script>
</head>
<body>
    <div class="bg" id="bg"></div>

    <main class="app" id="app">
        <div class="loading"><i class="fa-solid fa-circle-notch"></i>Đang mở nhà…</div>
    </main>

    <!-- Điện thoại: thanh dưới cùng. Máy tính (>= 1024px): menu dọc bên trái -->
    <nav class="tabbar" id="tabbar" aria-label="Điều hướng chính">
        <a class="tabbar__brand" href="#/" aria-label="HomeGlass - về trang Nhà"><span><i class="fa-solid fa-house-signal"></i></span>HomeGlass</a>
        <div class="tabbar__links">
            <span class="tabbar__hover" aria-hidden="true"></span>
            <span class="tabbar__pill" aria-hidden="true"></span>
            <a href="#/" data-path="/"><i class="fa-solid fa-house"></i><span>Nhà</span></a>
            <a href="#/temperature" data-path="/temperature"><i class="fa-solid fa-temperature-half"></i><span>Nhiệt độ</span></a>
            <a href="#/scenes" data-path="/scenes"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Kịch bản</span></a>
            <a href="#/assistant" data-path="/assistant"><i class="fa-solid fa-microphone"></i><span>Trợ lý</span></a>
            <a href="#/settings" data-path="/settings"><i class="fa-solid fa-gear"></i><span>Cài đặt</span></a>
        </div>
    </nav>

    <div id="toasts" aria-live="polite"></div>
    <div id="sheet-root"></div>

    <!-- Nạp qua import (không dùng src) để đi đúng bản đồ phiên bản ở trên -->
    <script type="module">import './js/main.js';</script>
</body>
</html>
