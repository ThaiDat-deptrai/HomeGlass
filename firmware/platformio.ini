; =============================================================
; HomeGlass firmware (PlatformIO)
; -------------------------------------------------------------
; 1 dự án, 2 loại mạch:
;   master  = ESP trung tâm (ESP32-S3 N16R8): WiFi + HiveMQ + ESP-NOW + lịch hẹn
;   node    = ESP phòng (ESP32-C3 super mini): servo / relay, nhận lệnh qua ESP-NOW
; MỌI ESP phòng nạp CHUNG bản "node". Số ESP đặt 1 lần lúc nạp (xem docs/nap-code.md).
;
; Nạp:   pio run -e master -t upload        pio run -e node -t upload
; Xem log: pio device monitor
; =============================================================

[platformio]
default_envs = master, node

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=0

; ---------- ESP trung tâm: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM) ----------
; Log (Serial) đi qua cổng USB "gốc" của S3 (cổng ghi USB). Cắm cổng COM/UART thì vẫn nạp được,
; nhưng muốn xem log qua cổng đó thì bỏ 2 dòng ARDUINO_USB_... bên dưới.
[env:master]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DHG_ROLE_MASTER
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<master/>

; ---------- ESP phòng: ESP32-C3 super mini (4MB flash) ----------
; Chỉ có cổng USB-C "native" -> bật USB CDC để xem log qua USB.
[env:node]
board = esp32-c3-devkitm-1
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DHG_ROLE_NODE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<node/>
